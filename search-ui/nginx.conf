# nginx config for the search-ui container (Task 5).
# Serves the React build on :3000 and proxies /elasticsearch/* to the
# es01 container on the shared Docker network, so the browser never needs
# direct access to the cluster.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React single-page app
    location / {
        try_files $uri /index.html;
    }

    # Same-origin proxy to Elasticsearch. Matches /elasticsearch and
    # /elasticsearch/<anything>, strips the prefix and forwards to es01, e.g.
    #   /elasticsearch/cv-transcriptions/_search
    #   -> http://es01:9200/cv-transcriptions/_search
    location /elasticsearch {
        rewrite ^/elasticsearch/?(.*)$ /$1 break;
        proxy_pass http://es01:9200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
